version: 1
steps:
  root:
    proc: overlayfs.open
    # inline/spec.yaml leaves formatter out and gets the in-process default.
    param:
      formatter: [gofmt]

  # Each package names its template file under templates with
  # //kama:option-file contextkey=<path>.
  load:
    proc: packages.load
    in: root
    param:
      # Listed one by one: ./... would load inline too, which has a spec of
      # its own.
      patterns: [./jsontemplate, ./tomltemplate, ./shareda, ./nested/deep]
      # The proc reads the syntax trees only, so generated files that do not
      # compile yet or any more do not stop it.
      allow_type_errors: true
  generate:
    proc: contextkey.generate
    in: load
    out: root
    param:
      key_type_func: keyTypeFunc

  # sharedb shares its template file with shareda and creates its keys with
  # another function, so it takes a step of its own.
  load_b:
    proc: packages.load
    in: root
    param:
      patterns: [./sharedb]
      allow_type_errors: true
  generate_b:
    proc: contextkey.generate
    in: load_b
    out: root
    param:
      key_type_func: newKey

  final:
    proc: overlayfs.copy_down
    in: root
    # copy_down reads root but does not wait for steps writing into it.
    after: [generate, generate_b]
