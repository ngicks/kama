version: 1
steps:
  root:
    proc: overlayfs.open
    # inline/spec.yaml leaves formatter out and gets the in-process default.
    param:
      formatter: [gofmt]

  json_template:
    proc: file.load
    in: root
    param:
      base: templates/json_keys
      formats: [json]
  json:
    proc: contextkey.generate
    in: json_template
    out: root
    param:
      dir: jsontemplate
      package: jsontemplate
      key_type_func: keyTypeFunc

  toml_template:
    proc: file.load
    in: root
    param:
      base: templates/toml_keys
      formats: [toml]
  toml:
    proc: contextkey.generate
    in: toml_template
    out: root
    param:
      dir: tomltemplate
      package: tomltemplate
      key_type_func: keyTypeFunc

  # Formats are tried in order. templates/shared.yml is found through the
  # second yaml extension after json finds nothing.
  shared_template:
    proc: file.load
    in: root
    param:
      base: templates/shared
      formats: [json, yaml]
  shared_a:
    proc: contextkey.generate
    in: shared_template
    out: root
    param:
      dir: shareda
      package: shareda
      key_type_func: keyTypeFunc
  shared_b:
    proc: contextkey.generate
    in: shared_template
    out: root
    param:
      dir: sharedb
      package: sharedb
      key_type_func: newKey

  nested_template:
    proc: file.load
    in: root
    param:
      base: templates/nested
  nested:
    proc: contextkey.generate
    in: nested_template
    out: root
    param:
      dir: nested/deep
      package: deepkeys
      key_type_func: keyTypeFunc

  final:
    proc: overlayfs.copy_down
    in: root
    # copy_down reads root but does not wait for steps writing into it.
    after: [json, toml, shared_a, shared_b, nested]
