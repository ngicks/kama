version: 1
steps:
  root:
    proc: overlayfs.open
  load:
    proc: packages.load
    in: root
    param:
      tests: true
  generate:
    proc: partial.generate
    in: load
    out: root
  final:
    proc: overlayfs.copy_down
    in: root
    # copy_down reads root but does not wait for steps writing into it.
    after: generate
