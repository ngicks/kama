# The options of Line and Sku, standing for their directives in
# internal/fixture/parity.
version: 1
types:
  Line:
    hook: false
    fields:
      Qty:
        validators:
          - name: cmp
            args: ">0 <=100"
      Url:
        validators:
          - name: format
            args: url
  Sku:
    validators:
      - name: regexp
        args: "^[A-Z]+$"
      - name: runes
        args: "<=8"
