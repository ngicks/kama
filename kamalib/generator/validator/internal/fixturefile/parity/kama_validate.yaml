# The options of Line, Sku and Discount, standing for their directives in
# internal/fixture/parity.
version: 1
types:
  Line:
    hook: false
    fields:
      Qty:
        validators:
          - cmp(gt=0, le=100)
      Url:
        validators:
          - format("url")
  Sku:
    validators:
      - regexp("^[A-Z]+$")
      - runes(le=8)
  Discount:
    hook: false
    validators:
      - members(0) or members(ge=2)
    fields:
      Percent:
        validators:
          - cmp(ge=10) or const(0)
          - not (const(5) or const(7))
      Kind:
        validators:
          - requires("amount") if const("fixed") else oneof(const("percent"), regexp("^p"))
