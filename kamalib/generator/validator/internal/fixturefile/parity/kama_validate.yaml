# The options of Line, Sku and Discount, standing for their directives in
# internal/fixture/parity.
version: 1
types:
  Line:
    hook: false
    fields:
      Qty:
        validators:
          - name: cmp
            args: ">0 <=100"
      Url:
        validators:
          - name: format
            args: url
  Sku:
    validators:
      - name: regexp
        args: "^[A-Z]+$"
      - name: runes
        args: "<=8"
  Discount:
    hook: false
    validators:
      - name: or
        args: 'members="==0", members=">=2"'
    fields:
      Percent:
        validators:
          - name: or
            args: 'cmp=">=10", const=0'
          - name: not
            args: or(const=5, const=7)
      Kind:
        validators:
          - name: if
            args: 'const=`"fixed"`, requires=amount, oneof(const=`"percent"`, regexp=^p)'
