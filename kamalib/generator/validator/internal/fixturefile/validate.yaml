# The options of Order, standing for its directives in
# internal/fixture/parity. kama_validate.yaml of the package gives those
# of Line.
version: 1
packages:
  github.com/ngicks/kama/kamalib/generator/validator/internal/fixturefile/parity:
    types:
      Order:
        hook: false
        validators:
          - members(ge=4)
        fields:
          Id:
            validators:
              - required
              - regexp("^[A-Z]{3}-[0-9]+$")
          Lines:
            validators:
              - length(ge=1, le=5)
          Currency:
            validators:
              - const("eur", "usd")
          Note:
            hook: true
